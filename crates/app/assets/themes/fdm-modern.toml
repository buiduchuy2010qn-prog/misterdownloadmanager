# FDM Modern: Inspired by Free Download Manager 6.x clean, flat, modern interface
name = "FDM Modern"
icon-set = "breeze"
icons = "color"

[controls]
field-focus = "border"
check = "fluent"
button = "fluent"
progress = "bar"
scroll = "overlay"
focus = "ring"
caption = "system"

[sizes]
radius = 6
"radius.button" = 6
"radius.part" = 4
"radius.check" = 4
"radius.flyout" = 8
"radius.menu-item" = 5
"radius.popup" = 6
"radius.egui" = 6
"list.row" = 22
"list.header" = 28
"font.ui" = 12.5
"font.ui.bold" = 13.5
"font.dialog" = 11.5

[seeds.light]
background = "#f4f6f9"
surface = "#ffffff"
header = "#f8fafc"
text = "#1e293b"
accent = "#2b88d8"
selection = "#e0f2fe"
error = "#e11d48"
warning = "#d97706"
success = "#16a34a"

[seeds.dark]
background = "#181a1f"
surface = "#21252b"
header = "#1c1f26"
text = "#e2e8f0"
accent = "#3898ec"
selection = "#1e3a5f"
