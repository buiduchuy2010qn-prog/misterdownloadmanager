# FDM Modern: Inspired by Free Download Manager 6.x clean, flat, modern interface
name = "FDM Modern"
icon-set = "breeze"
icons = "color"

[controls]
field-focus = "border"
check = "fluent"
button = "fluent"
progress = "bar"
scroll = "overlay"
focus = "ring"
caption = "system"

[sizes]
radius = 6
"radius.button" = 6
"radius.part" = 5
"radius.check" = 4
"radius.flyout" = 8
"radius.menu-item" = 5
"radius.popup" = 6
"radius.egui" = 6
"list.row" = 48
"list.header" = 32
"font.ui" = 12.5
"font.ui.bold" = 13.5
"font.dialog" = 11.5

[seeds.light]
background = "#f3f5f8"
surface = "#ffffff"
header = "#f8fafc"
text = "#0f172a"
accent = "#2563eb"
selection = "#dbeafe"
error = "#e11d48"
warning = "#d97706"
success = "#16a34a"

[seeds.dark]
background = "#16181d"
surface = "#1f232b"
header = "#1a1d24"
text = "#f1f5f9"
accent = "#3b82f6"
selection = "#1e3a5f"
error = "#fb7185"
warning = "#fbbf24"
success = "#22c55e"

