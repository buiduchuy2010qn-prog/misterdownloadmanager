# Builds the downloads: Windows (tools/installer/build.ps1: installer, portable zip, plain zip),
# the browser extensions (tools/extension/pack.ps1: Chromium zip, Firefox .xpi),
# Linux (build-linux.sh: AppImage, tar.gz, .deb, .rpm) and, experimental and not yet tested by
# us, macOS (build-macos.sh: a .dmg for Apple Silicon, one for Intel; named "-experimental").
# - A pushed tag vX.Y.Z (matching Cargo.toml's version) publishes a GitHub release with them and
#   SHA256SUMS.txt, its notes from CHANGELOG.md (Help -> Check for updates sees it at once). The
#   release waits for Windows and the extensions: a failed Linux or macOS build leaves those out.
# - Run by hand (Actions -> Release -> Run workflow) it only builds and keeps them as artifacts:
#   nothing is published, and nothing is sent to addons.mozilla.org or the Chrome Web Store.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish signed GitHub Release for Cargo.toml version"
        required: false
        type: boolean
        default: true
      all_platforms:
        description: "Also build Linux and macOS packages"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  geo:
    # Where a download's server is (#140): this month's IP-to-country table (DB-IP's IP to Country
    # Lite, CC BY 4.0) for every build. A failed download keeps the committed one, with a warning.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: IP-to-country table
        run: python3 tools/geo/build.py --release

      - uses: actions/upload-artifact@v4
        with:
          name: geo-data
          path: crates/geo/data/*
          retention-days: 7

  windows:
    needs: geo
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: geo-data
          path: crates/geo/data

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-cargo-

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but Cargo.toml says $v" }

      - name: Tests
        run: cargo test --workspace

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Code-signing certificate
        id: cert
        shell: pwsh
        env:
          PFX: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          if (-not $env:PFX) { "No certificate: building unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          "command=`"$($signtool.FullName)`" sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f `"$pfx`" /p `"$env:PASSWORD`" `$f" >> $env:GITHUB_OUTPUT

      - name: Installer and portable zip
        shell: pwsh
        env:
          MDM_SIGN_COMMAND: ${{ steps.cert.outputs.command }}
        run: |
          Remove-Item target/dist/* -Force -ErrorAction SilentlyContinue
          ./tools/installer/build.ps1

      # Crash reports: the release's symbols (dump_syms reads each program's .pdb beside it; no
      # download includes the .pdb files themselves).
      - name: Symbols
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }} # downloads the build's helpers signed in (fetch_release.py)
        run: |
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $exes = "misterdownloadmanager", "misterdownloadmanager-nmhost", "misterdownloadmanager-cli", "misterdownloadmanager-mcp" |
            ForEach-Object { "target/release/$_.exe" }
          python tools/installer/symbols.py windows-x64 $v target/dist @exes
          if ($LASTEXITCODE) { throw "symbols failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/*

  extension:
    # Every browser's extension as its own download: Chrome, Edge, Brave, Opera and Vivaldi
    # (unzip, then load the folder unpacked) and Firefox (.xpi).
    runs-on: ubuntu-latest
    # The store steps below run only for a pushed tag, and only when their key is there (a step's
    # `if` sees the job's env): a run by hand never sends anything to a store.
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node tools/extension/test.mjs

      - name: Chromium zip, Firefox .xpi and the Chrome Web Store's zip
        shell: pwsh
        run: |
          ./tools/extension/pack.ps1
          node tools/extension/check-pack.mjs
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          New-Item -ItemType Directory -Force target/dist | Out-Null
          Copy-Item target/extension/mdm-chromium.zip "target/dist/MisterDownloadManager-$v-extension-chromium.zip"
          Copy-Item target/extension/mdm-firefox.xpi "target/dist/MisterDownloadManager-$v-extension-firefox.xpi"
          # For the Chrome Web Store (the next step, or its dashboard by hand): kept with the
          # build, not the release.
          New-Item -ItemType Directory -Force target/store | Out-Null
          Copy-Item target/extension/mdm-chrome-store.zip "target/store/MisterDownloadManager-$v-chrome-web-store.zip"

      # The Firefox add-on is listed on addons.mozilla.org: each release's version is sent there
      # for review (not waited for); Firefox installs and updates it from its listing. The .xpi
      # in the release stays the unsigned one (for about:debugging).
      - name: Send the Firefox add-on to addons.mozilla.org
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.AMO_JWT_ISSUER != '' }}
        env:
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: pwsh
        run: |
          $log = npx --yes web-ext@8 sign --source-dir target/extension/firefox --artifacts-dir target/signed `
            --channel listed --approval-timeout 0 --api-key $env:AMO_JWT_ISSUER --api-secret $env:AMO_JWT_SECRET 2>&1
          $log | Write-Output
          if ($LASTEXITCODE -ne 0) {
            # A re-run: Mozilla refuses a version it has already. Anything else fails here.
            if (($log -join "`n") -match "already exists") {
              Write-Output "::warning::This version is on addons.mozilla.org already."
              exit 0
            }
            exit 1
          }

      # The extension is listed in the Chrome Web Store (ejoleppdfgjdndddcjoehopknmlglojp,
      # crates/ipc STORE_ID): each release's zip is uploaded and sent for review (not waited for);
      # Chrome, Edge, Brave, Opera and Vivaldi update from the listing. A store refusal (a version
      # it has already) never fails the release.
      - name: Send the extension to the Chrome Web Store
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.CWS_REFRESH_TOKEN != '' }}
        continue-on-error: true
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ejoleppdfgjdndddcjoehopknmlglojp
        run: npx --yes chrome-webstore-upload-cli@4 --source target/extension/mdm-chrome-store.zip

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store
          path: target/store/*

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: target/dist/*

  linux:
    # The oldest supported Ubuntu: the programs run on its glibc (2.35) and newer.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.all_platforms == true }}
    needs: geo
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: geo-data
          path: crates/geo/data

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-cargo-

      - name: Libraries and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev rpm python3-pil zsync

      - name: AppImage, tar.gz, .deb, .rpm
        env:
          GH_TOKEN: ${{ github.token }} # downloads the build's helpers signed in (fetch_release.py)
        run: bash tools/installer/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/dist/*

  macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.all_platforms == true }}
    needs: geo
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: geo-data
          path: crates/geo/data

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-cargo-

      - name: Apple Silicon and Intel .dmg
        env:
          GH_TOKEN: ${{ github.token }} # downloads the build's helpers signed in (fetch_release.py)
        run: bash tools/installer/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/dist/*

  publish:
    permissions:
      contents: write # the release
      issues: read
      pull-requests: read
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/') || inputs.publish == true) &&
      needs.windows.result == 'success' &&
      needs.extension.result == 'success'
    needs: [windows, extension, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist

      - uses: actions/download-artifact@v4
        if: needs.linux.result == 'success'
        with:
          name: linux
          path: dist

      - uses: actions/download-artifact@v4
        if: needs.macos.result == 'success'
        with:
          name: macos
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MDM_RELEASE_KEY: ${{ secrets.MDM_RELEASE_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $tag = if ("${{ github.ref }}" -like "refs/tags/*") { "${{ github.ref_name }}" } else { "v$v" }
          if ($tag -ne "v$v") { throw "tag $tag but Cargo.toml says $v" }

          # One SHA256SUMS.txt for every release file (each build wrote its own).
          Remove-Item dist/SHA256SUMS* -ErrorAction SilentlyContinue
          Remove-Item dist/ota.json -ErrorAction SilentlyContinue
          $files = Get-ChildItem dist -File | Sort-Object Name
          $sums = ($files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }) -join "`n"
          [IO.File]::WriteAllBytes("dist/SHA256SUMS.txt", [Text.Encoding]::ASCII.GetBytes("$sums`n"))

          if ($env:MDM_RELEASE_KEY) {
            $key = Join-Path $env:RUNNER_TEMP "mdm-release.asc"
            [IO.File]::WriteAllBytes($key, [Text.Encoding]::ASCII.GetBytes($env:MDM_RELEASE_KEY))
            gpg --batch --quiet --import $key
            Remove-Item $key -Force
            $fpr = (gpg --with-colons --fingerprint | Select-String '^fpr:' | Select-Object -First 1).Line.Split(':')[9]
            if (-not $fpr) { throw "no fingerprint found after importing MDM_RELEASE_KEY" }
            gpg --batch --yes --detach-sign --local-user $fpr --output dist/SHA256SUMS.txt.sig dist/SHA256SUMS.txt
            if ($LASTEXITCODE) { throw "signing SHA256SUMS.txt failed" }
            gpg --batch --verify dist/SHA256SUMS.txt.sig dist/SHA256SUMS.txt
            if ($LASTEXITCODE) { throw "the signature of SHA256SUMS.txt doesn't verify" }
          } else {
            throw "MDM_RELEASE_KEY isn't set: refusing to publish an unsigned OTA release."
          }

          $log = Get-Content CHANGELOG.md -Raw -ErrorAction SilentlyContinue
          $m = [regex]::Match("$log", "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## |\z)")
          $title = "Mister Download Manager $tag (Custom FDM Modern + OTA)"
          $notesBody = if ($m.Success -and $m.Groups[1].Value.Trim()) {
            $m.Groups[1].Value.Trim() -replace '\]\((?![a-z]+:|#)([^)\s]+)\)', "](https://github.com/${{ github.repository }}/blob/$tag/`$1)"
          } else {
            "## Mister Download Manager $tag`n- Responsive FDM 6.x compact and maximized layout (zero horizontal scrollbar, full downloaded/total size, compact percentage status pills, unclipped speed and ETA)`n- Intuitive inline Pause/Resume/Folder controls and state-colored progress bars`n- Native Win32 ShellExecuteW + ProgId association file opener fix`n- Cryptographically signed Ed25519 in-app OTA auto-updater (ota.json CDN + GitHub Releases)"
          }
          [IO.File]::WriteAllBytes("notes.md", [Text.UTF8Encoding]::new($false).GetBytes($notesBody))

          # Static CDN manifest (ota.json) so in-app OTA checks never hit GitHub API rate limits.
          $signedFiles = Get-ChildItem dist -File | Sort-Object Name
          $publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $repo = "${{ github.repository }}"
          $otaObj = [ordered]@{
            tag_name     = $tag
            published_at = $publishedAt
            html_url     = "https://github.com/$repo/releases/tag/$tag"
            body         = $notesBody
            assets       = @(
              $signedFiles | ForEach-Object {
                [ordered]@{
                  name                 = $_.Name
                  browser_download_url = "https://github.com/$repo/releases/download/$tag/$($_.Name)"
                }
              }
            )
          }
          $otaJson = $otaObj | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllBytes("dist/ota.json", [Text.UTF8Encoding]::new($false).GetBytes($otaJson))

          $all = (Get-ChildItem dist -File).FullName
          $exists = $false
          $ErrorActionPreference = 'Continue'
          gh release view $tag >$null 2>&1
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            gh release upload $tag $all --clobber
            if ($LASTEXITCODE) { throw "gh release upload failed" }
            gh release edit $tag --latest --title $title --notes-file notes.md
            if ($LASTEXITCODE) { throw "gh release edit failed" }
          } else {
            gh release create $tag --target "${{ github.sha }}" --latest --title $title --notes-file notes.md $all
            if ($LASTEXITCODE) { throw "gh release create failed" }
          }
